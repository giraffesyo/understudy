name: CI

on:
  push:
    branches: [canary]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a new govulncheck finding or ansible-core drift shows up
    # without a push.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CGO_ENABLED: "0"
  # CI-only tools, run with `go run <module>@<version>` so go.mod stays
  # free of them (dependabot does not bump these; do it by hand).
  STATICCHECK: honnef.co/go/tools/cmd/staticcheck@v0.8.1 # 2026.2.1
  GOVULNCHECK: golang.org/x/vuln/cmd/govulncheck@v1.8.0

jobs:
  lint:
    name: gofmt / mod verify / vet / staticcheck / depcheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-key: lint
      - name: go mod verify
        run: go mod verify
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $(echo "$unformatted" | tr '\n' ' ')"
            gofmt -d .
            exit 1
          fi
      - name: depcheck (agent imports stay minimal)
        run: make depcheck
      - name: build agents (embedded by the control binary)
        run: make agents
      - name: go vet
        run: |
          go vet ./...
          go vet -tags e2e ./test/e2e/
          go vet -tags golden ./test/e2e/
      - name: staticcheck
        run: |
          go run "$STATICCHECK" ./...
          go run "$STATICCHECK" -tags e2e ./test/e2e/
          go run "$STATICCHECK" -tags golden ./test/e2e/

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-key: vuln
      - run: make agents
      - name: govulncheck (stdlib of the Go release builds use, and modules)
        run: go run "$GOVULNCHECK" ./...

  test:
    name: unit + local e2e (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, go: stable }
          - { os: macos-latest, go: stable }
          # The minimum go.mod declares.
          - { os: ubuntu-latest, go: go.mod }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          cache-key: test
      - run: make build
      - run: make test

  fips:
    name: FIPS compatibility (controller + embedded agents, cgo disabled)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOFIPS140: certified
      UNDERSTUDY_REQUIRE_PREREQS: "1"
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-key: fips
      - run: make test-fips
      - name: SSH execution with the embedded FIPS agent
        run: go test -tags e2e -run '^TestSSHPingCommandFacts$' ./test/e2e/

  race:
    env:
      CGO_ENABLED: "1" # The Go race detector requires cgo.
    name: unit (race detector)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-key: race
      - run: make build
      - run: go test -race -count=1 -timeout 40m ./...

  cross:
    name: cross-compile (every release platform)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-key: cross
      - name: make cross (RELEASE_PLATFORMS in the Makefile)
        run: make cross

  goreleaser:
    name: goreleaser check + snapshot (archives, packages, SBOMs, images)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser reads the tags for the snapshot version.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-key: goreleaser
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2 # keep in step with GORELEASER_VERSION in release.yml
          install-only: true
      - name: goreleaser check
        run: goreleaser check
      # The release build without publishing or signing: every archive,
      # package and SBOM, and the image per platform (loaded locally, never
      # pushed), so a broken .goreleaser.yaml or Dockerfile fails here.
      - name: goreleaser release --snapshot
        run: goreleaser release --snapshot --clean --skip=sign
      - name: check the snapshot image
        run: |
          img=$(jq -r '[.[] | select(.type | startswith("Docker Image")) | .name | select(endswith("-amd64"))][0]' dist/artifacts.json)
          [ -n "$img" ] && [ "$img" != null ] || { echo "::error::no linux/amd64 image in dist/artifacts.json"; exit 1; }
          docker run --rm "$img" version

  golden:
    name: golden (vs ansible-playbook, ${{ matrix.shard }})
    # The whole suite runs longer than one job's timeout, so it is split by
    # test function; "rest" runs everything the other shards do not, so a
    # new test lands there.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: differential, run: "^TestGoldenDifferential$", skip: "" }
          - { shard: output, run: "^(TestGoldenOutput|TestGoldenOutputVerbose)$", skip: "" }
          - { shard: output-vv, run: "^(TestGoldenOutputVV|TestGoldenOutputVVV)$", skip: "" }
          - { shard: containers, run: "^(TestLinuxGoldenOutput|TestRHELGoldenDifferential)$", skip: "" }
          - shard: rest
            run: ""
            skip: "^(TestGoldenDifferential|TestGoldenOutput|TestGoldenOutputVerbose|TestGoldenOutputVV|TestGoldenOutputVVV|TestLinuxGoldenOutput|TestRHELGoldenDifferential)$"
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # A missing ansible-playbook, docker or bin/understudy fails the suite
      # instead of skipping it.
      UNDERSTUDY_REQUIRE_PREREQS: "1"
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-key: golden
      # The reference controller Python: understudy reproduces CPython
      # 3.14's wording (error messages, argparse's colored help), so the
      # golden suite only matches on 3.14. An exact patch keeps the
      # reference fixed; bump it with .github/golden/requirements.in.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: install ansible-core (pinned, hash-checked; .github/golden/requirements.in)
        run: |
          python -m pip install --require-hashes --no-deps -r .github/golden/requirements.txt
          want=$(sed -n 's/^ansible-core==//p' .github/golden/requirements.in)
          got=$(ansible-playbook --version | head -n 1)
          echo "$got"
          case "$got" in
            *"[core $want]"*) ;;
            *) echo "::error::expected ansible-core $want, got: $got"; exit 1 ;;
          esac
      - run: make build
      - name: golden suite
        # The harness runs ansible-playbook on pipes (it refuses non-blocking
        # stdio) with an explicit interpreter, so interpreter discovery (a
        # Python-only artifact) stays out of the compared output.
        env:
          RUN: ${{ matrix.run }}
          SKIP: ${{ matrix.skip }}
        run: |
          ANSIBLE_PYTHON_INTERPRETER="$(command -v python3)"
          export ANSIBLE_PYTHON_INTERPRETER
          go test -count=1 -tags golden -timeout 60m -run "$RUN" -skip "$SKIP" ./test/e2e/

  e2e:
    name: e2e (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNDERSTUDY_REQUIRE_PREREQS: "1"
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-key: e2e
      - run: make build
      - name: SSH + systemd container suites
        run: go test -count=1 -tags e2e -timeout 45m ./test/e2e/
