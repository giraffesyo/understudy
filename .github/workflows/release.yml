name: Release

# Pushing a tag like v1.2.3 builds the release tarballs with `make release`
# (plain Go cross-compilation, version stamped from the tag) and publishes
# them, with checksums.txt, as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: unit tests
        run: make build test
      - name: build tarballs
        run: make release VERSION="${GITHUB_REF_NAME}"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag "${flags[@]}"
