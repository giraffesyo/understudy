name: Release

# The one release path. On every push to canary (the default and release
# branch), release-please opens (or
# updates) a release PR from the Conventional Commits since the last
# release: CHANGELOG.md plus the version in .release-please-manifest.json.
# Merging that PR makes release-please tag vX.Y.Z and create the GitHub
# release; release-please stays the authority for the version, the tag and
# the notes. The `artifacts` job then checks out that tag and runs
# GoReleaser (.goreleaser.yaml), which builds the tarballs, the deb/rpm/apk
# packages, SBOMs and checksums.txt, signs checksums.txt with cosign
# (keyless), uploads them to the existing release without touching its
# notes, and pushes and signs the multi-arch image
# ghcr.io/giraffesyo/understudy. The job then attests build provenance for
# every file in checksums.txt and for the image, and the SBOMs.
#
# workflow_dispatch (re)builds and uploads the artifacts of an existing
# release, e.g. after a failed run (existing assets are replaced, the image
# tags re-pushed).

on:
  push:
    branches: [canary]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build and upload artifacts for (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  GORELEASER_VERSION: v2.18.2

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # tags, releases, the release PR's branch
      pull-requests: write # the release PR
      issues: write # the release PR's "autorelease" labels
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # The workflow's own token: a release PR it opens does not trigger
          # CI (GitHub's rule for GITHUB_TOKEN events), so required status
          # checks on canary would block merging it. The artifacts job below
          # runs in this workflow, so publishing needs no other trigger.
          token: ${{ github.token }}
          # Releases are cut from canary, the repository's default branch.
          target-branch: canary
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  artifacts:
    needs: release-please
    if: >-
      !cancelled() &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # upload release assets
      packages: write # push the image to ghcr.io
      id-token: write # keyless cosign signatures and the attestations' Sigstore certificates
      attestations: write # store the attestations
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: check the tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::not a release tag: $TAG"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          # GoReleaser reads the tags to find the current and previous one.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-key: release
          # Release builds do not restore caches other runs wrote.
          cache: "false"
      - name: unit tests
        run: make build test
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true
      # Before anything is published: build the runner's own target
      # (linux/amd64) alone and check that the tag is what `understudy
      # version` reports. (GOOS/GOARCH are not set: the before hook's
      # `go run` would inherit them.)
      - name: check the stamped version
        run: |
          goreleaser build --clean --single-target --id understudy
          bin=$(jq -r '.[] | select(.type == "Binary" and .goos == "linux" and .goarch == "amd64") | .path' dist/artifacts.json)
          [ -n "$bin" ] || { echo "::error::no linux/amd64 binary in dist/artifacts.json"; exit 1; }
          got=$("$bin" version)
          echo "$got"
          [ "$got" = "understudy $TAG" ] || { echo "::error::version is '$got', want 'understudy $TAG'"; exit 1; }
      - name: goreleaser release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: goreleaser release --clean
      - name: attest build provenance (archives, packages, SBOMs)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: image digest
        id: image
        run: |
          cat dist/digests.txt
          digests=$(awk '{ print $1 }' dist/digests.txt | sort -u)
          if [ "$(printf '%s\n' "$digests" | grep -c .)" != 1 ]; then
            echo "::error::want exactly one image digest in dist/digests.txt"
            exit 1
          fi
          echo "digest=sha256:$digests" >> "$GITHUB_OUTPUT"
      - name: attest build provenance (image)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      # One SBOM attestation per tarball, with that platform's SBOM (one step
      # per build target in .goreleaser.yaml).
      - name: attest SBOM (linux/amd64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/understudy_${{ env.TAG }}_linux_amd64.tar.gz
          sbom-path: dist/understudy_${{ env.TAG }}_linux_amd64.sbom.cdx.json
      - name: attest SBOM (linux/arm64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/understudy_${{ env.TAG }}_linux_arm64.tar.gz
          sbom-path: dist/understudy_${{ env.TAG }}_linux_arm64.sbom.cdx.json
      - name: attest SBOM (darwin/amd64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/understudy_${{ env.TAG }}_darwin_amd64.tar.gz
          sbom-path: dist/understudy_${{ env.TAG }}_darwin_amd64.sbom.cdx.json
      - name: attest SBOM (darwin/arm64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/understudy_${{ env.TAG }}_darwin_arm64.tar.gz
          sbom-path: dist/understudy_${{ env.TAG }}_darwin_arm64.sbom.cdx.json
