---
# Serialization, encoding, hashing, and numeric-filter compatibility.
- name: serialization
  hosts: all
  gather_facts: false
  vars:
    d: {b: 2, a: 1, c: 3}
    nested: [[1, 2], [3, [4, 5]]]
    pairs:
      - {key: x, value: 10}
      - {key: y, value: 20}
  tasks:
    - name: json round trip
      assert:
        that:
          - "d | to_json | from_json == d"
          - "'{\"n\": 5}' | from_json == {'n': 5}"
          - "[1, 2] | to_json == '[1, 2]'"

    - name: yaml round trip
      assert:
        that:
          - "d | to_yaml | from_yaml == d"
          - "'a: 1\nb: 2' | from_yaml == {'a': 1, 'b': 2}"

    - name: base64
      assert:
        that:
          - "'hello' | b64encode == 'aGVsbG8='"
          - "'aGVsbG8=' | b64decode == 'hello'"

    - name: hashing
      assert:
        that:
          - "'abc' | hash('sha256') == 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad'"
          - "'abc' | hash('md5') == '900150983cd24fb0d6963f7d28e17f72'"

    - name: regex findall
      assert:
        that:
          - "'a1b2c3' | regex_findall('[0-9]') == ['1', '2', '3']"
          - "'x=1 y=2' | regex_findall('[a-z]=([0-9])') == ['1', '2']"

    - name: dict transforms
      assert:
        that:
          - "d | dict2items(key_name='k', value_name='v') | map(attribute='k') | sort == ['a', 'b', 'c']"
          - "pairs | items2dict == {'x': 10, 'y': 20}"

    - name: flatten
      assert:
        that:
          - "nested | flatten == [1, 2, 3, 4, 5]"
          - "nested | flatten(levels=1) == [1, 2, 3, [4, 5]]"
          # Note: zip is intentionally not compared to a list literal here —
          # Python's zip yields tuples, which compare unequal to lists; Go
          # has no tuple type. Both engines iterate zip output identically.

    - name: numeric filters
      assert:
        that:
          - "-5 | abs == 5"
          - "3.14159 | round(2) == 3.14"
          - "2.5 | round == 2.0"   # banker's rounding (half to even), like Python
          - "3.5 | round == 4.0"
          - "2.5 | round(0, 'ceil') == 3.0"
          - "2.9 | round(0, 'floor') == 2.0"
          - "10 | float == 10.0"
          - "'0x1f' | int(0, 16) == 31"

    - name: path filters
      assert:
        that:
          - "'/etc/nginx/nginx.conf' | basename == 'nginx.conf'"
          - "'/etc/nginx/nginx.conf' | dirname == '/etc/nginx'"
          - "'archive.tar.gz' | splitext | last == '.gz'"
          - "['/etc', 'app', 'conf.d'] | path_join == '/etc/app/conf.d'"
