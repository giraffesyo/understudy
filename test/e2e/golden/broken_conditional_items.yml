---
# A broken conditional names where its value came from for loop items
# (the item of a list written out, of a variable's list, of a list read
# through hostvars) and for values read through hostvars (an inventory
# variable, a set_fact value).
- hosts: h1
  gather_facts: false
  vars:
    nums: [1, 2]
  tasks:
    - set_fact:
        fact_num: 7
        fact_list: [5, 6]

    - name: items of a list written out
      debug:
        msg: "{{ item }}"
      when: item
      loop: [1, 2]
      ignore_errors: true

    - name: items of a variable's list
      debug:
        msg: "{{ item }}"
      when: item
      loop: "{{ nums }}"
      ignore_errors: true

    - name: items of a list the loop computes
      debug:
        msg: "{{ item }}"
      when: item
      loop: "{{ [3, 4] }}"
      ignore_errors: true

    - name: an inventory variable through hostvars
      debug:
        msg: x
      when: hostvars['h1'].num
      ignore_errors: true

    - name: another host's
      debug:
        msg: x
      when: hostvars.h2['word']
      ignore_errors: true

    - name: a set_fact value through hostvars
      debug:
        msg: x
      when: hostvars.h1.fact_num
      ignore_errors: true

    - name: an item of a set_fact list through hostvars
      debug:
        msg: x
      when: hostvars.h1.fact_list[1]
      ignore_errors: true

    - name: items of a list read through hostvars
      debug:
        msg: "{{ item }}"
      when: item
      loop: "{{ hostvars.h1.fact_list }}"
      ignore_errors: true
