---
# password_hash (glibc crypt sha256/sha512). Salt and rounds are pinned so the
# result is deterministic and identical across engines.
- name: password_hash
  hosts: all
  gather_facts: false
  vars:
    pw: "mypassword"
  tasks:
    - name: sha512 with default rounds (passlib default 656000)
      assert:
        that:
          - "(pw | password_hash('sha512', 'abcdefghijklmnop')) == '$6$rounds=656000$abcdefghijklmnop$wGRyKQtBN7L4Hcqs5soaHMTrNAMXJ9vUEwTwYVnNx9ph/Rbt//JRocCbFT.g5wSOGj0/WEndWqnL1xApJx021/'"

    - name: sha256 with default rounds (passlib default 535000)
      assert:
        that:
          - "(pw | password_hash('sha256', 'abcdefghijklmnop')) == '$5$rounds=535000$abcdefghijklmnop$1/3o1Qfuk0O9tpK/FEQV9HYgDZd2Vx7kWZtyZzd6K..'"

    - name: sha512 with glibc-default rounds omits the rounds field
      assert:
        that:
          - "(pw | password_hash('sha512', 'abcdefghijklmnop', rounds=5000)) == '$6$abcdefghijklmnop$jxZ5UKgPKWlCx21QPZbkQOj73EKOWhff2HX66XmEGXBN7/VGv5K5AH0mgtIbyEHEwJOO3UibHo1CrTlQvXbbS/'"

    - name: sha512 with explicit rounds
      assert:
        that:
          - "('secret' | password_hash('sha512', 'saltsalt', rounds=10000)) == '$6$rounds=10000$saltsalt$WowrPBpEDVlCoruBosYlrZycTCx3//TyDHYqEhX9DUHHt0XTztUqzQDDUuvUGRA8aUe9p55hcAxeGcu58sm3u.'"

    - name: hash round-trips through the same salt (idempotent)
      assert:
        that:
          - "(pw | password_hash('sha512', 'abcdefghijklmnop')) == (pw | password_hash('sha512', 'abcdefghijklmnop'))"
