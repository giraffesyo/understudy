---
# password_hash (glibc crypt sha256/sha512). Salt and rounds are pinned so the
# result is deterministic. The hashes are printed, not asserted: ansible-core
# hashes through libxcrypt where the controller has it (glibc Linux), where a
# given salt only seeds crypt_gensalt, and through passlib elsewhere (macOS),
# where it is used verbatim; understudy must match either way.
- name: password_hash
  hosts: all
  gather_facts: false
  vars:
    pw: "mypassword"
  tasks:
    - name: sha512 with default rounds (passlib default 656000)
      debug: {msg: "{{ pw | password_hash('sha512', 'abcdefghijklmnop') }}"}

    - name: sha256 with default rounds (passlib default 535000)
      debug: {msg: "{{ pw | password_hash('sha256', 'abcdefghijklmnop') }}"}

    - name: sha512 with glibc-default rounds omits the rounds field
      debug: {msg: "{{ pw | password_hash('sha512', 'abcdefghijklmnop', rounds=5000) }}"}

    - name: sha512 with explicit rounds
      debug: {msg: "{{ 'secret' | password_hash('sha512', 'saltsalt', rounds=10000) }}"}

    - name: hash round-trips through the same salt (idempotent)
      assert:
        that:
          - "(pw | password_hash('sha512', 'abcdefghijklmnop')) == (pw | password_hash('sha512', 'abcdefghijklmnop'))"

    # blowfish (bcrypt): through passlib the salt's unused bits are
    # repaired; through libxcrypt the salt's first 16 bytes are encoded.
    - name: blowfish with the default cost (12)
      debug: {msg: "{{ pw | password_hash('blowfish', 'abcdefghijklmnopqrstuv') }}"}

    - name: blowfish with rounds and idents
      debug:
        msg:
          - "{{ pw | password_hash('blowfish', 'abcdefghijklmnopqrstuv', rounds=4) }}"
          - "{{ ('x' * 80) | password_hash('blowfish', 'ABCDEFGHIJKLMNOPQRSTU.', rounds=5, ident='2a') }}"
          - "{{ '' | password_hash('blowfish', './0123456789ABCDEFGHIJ', rounds=4, ident='2y') }}"

    - name: blowfish with a random salt
      debug: {msg: "{{ (pw | password_hash('blowfish', rounds=4))[:7] }} {{ pw | password_hash('blowfish', rounds=4) | length }}"}
