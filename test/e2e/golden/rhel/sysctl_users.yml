---
# Fast module differentials (no package installs): sysctl set/idempotence
# and user create/modify/remove. Reset clears the sysctl value + entries and
# the created users/groups.
- name: sysctl and users on RHEL
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: set a kernel parameter
      sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_set: true
        state: present

    - name: set it again is a no-op
      sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_set: true
        state: present

    - name: confirm live value
      command: cat /proc/sys/net/ipv4/ip_forward
      register: fwd
      changed_when: false

    - name: value is applied
      assert:
        that: fwd.stdout == "1"

    - name: create a group
      group: {name: deploy, state: present}

    - name: create a user with attributes
      user:
        name: deploy
        group: deploy
        shell: /bin/bash
        create_home: true

    - name: same user is a no-op
      user:
        name: deploy
        group: deploy
        shell: /bin/bash

    - name: change the shell
      user: {name: deploy, shell: /sbin/nologin}

    - name: add a supplementary group
      group: {name: wheel2, state: present}

    - name: append the user to it
      user: {name: deploy, groups: [wheel2], append: true}

    - name: append again is a no-op
      user: {name: deploy, groups: [wheel2], append: true}

# sysctl runs the sysctl binary, so an unprivileged set fails with its
# message; the asserts pin the exact text on both tools.
- name: sysctl failures without privilege
  hosts: all
  gather_facts: false
  vars:
    denied_msg: "setting user.max_user_namespaces failed: sysctl: permission denied on key \"user.max_user_namespaces\"\n"
  tasks:
    - name: unprivileged sysctl_set
      sysctl:
        name: user.max_user_namespaces
        value: "12345"
        sysctl_set: true
        reload: false
        sysctl_file: /tmp/understudy-golden-sysctl.conf
      register: denied
      ignore_errors: true
    - name: the failure carries sysctl's own message
      assert:
        that:
          - denied is failed
          - denied.msg == denied_msg
    - name: unprivileged reload
      sysctl:
        name: vm.swappiness
        value: "11"
        sysctl_file: /tmp/understudy-golden-sysctl.conf
      register: reload
      ignore_errors: true
    - name: the reload failure carries sysctl's message
      assert:
        that:
          - reload is failed
          - reload.msg is match("Failed to reload sysctl. sysctl. permission denied on key")
    - name: the reload's file was written (the failed set stopped before its write)
      command: cat /tmp/understudy-golden-sysctl.conf
      register: conf
      changed_when: false
    - assert:
        that: conf.stdout_lines == ['vm.swappiness=11']
