---
# File-module behavior on a real host: directory/touch/absent/link,
# copy + lineinfile + blockinfile with ownership under become, stat.
# Both tools run this once against the container; recap + per-task status
# must match. Ownership preservation across edits is exercised here.
- name: file modules on RHEL
  hosts: all
  become: true
  gather_facts: false
  vars:
    root: /etc/understudy-golden
  tasks:
    - name: create a group
      group: {name: udgrp, state: present}

    - name: create a user
      user: {name: uduser, group: udgrp, system: true, shell: /sbin/nologin}

    - name: config directory owned by the user
      file:
        path: "{{ root }}"
        state: directory
        owner: uduser
        group: udgrp
        mode: "0750"

    - name: seed a file with ownership
      copy:
        content: "level=info\n"
        dest: "{{ root }}/app.conf"
        owner: uduser
        group: udgrp
        mode: "0640"

    - name: edit the file (must preserve owner)
      lineinfile:
        path: "{{ root }}/app.conf"
        regexp: "^level="
        line: "level=debug"

    - name: managed block (must preserve owner)
      blockinfile:
        path: "{{ root }}/app.conf"
        block: |
          extra one
          extra two

    - name: overwrite via copy, no owner given (must keep owner)
      copy:
        content: "level=debug\nextra one\nextra two\nfinal\n"
        dest: "{{ root }}/app.conf"

    - name: touch a file
      file: {path: "{{ root }}/marker", state: touch, mode: "0644"}

    - name: symlink
      file: {path: "{{ root }}/link", src: "{{ root }}/app.conf", state: link}

    - name: stat the config
      stat: {path: "{{ root }}/app.conf"}
      register: st

    - name: verify stat
      assert:
        that:
          - st.stat.exists
          - st.stat.mode == "0640"
          - st.stat.isreg

    - name: remove the marker
      file: {path: "{{ root }}/marker", state: absent}
