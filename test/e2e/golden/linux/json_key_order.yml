# distros: ubuntu
---
# Dicts keep their key order across the agent wire both ways: a uri json
# body in the task's order, and uri's json in the server's order (here an
# echo of the body, then a fixed document). Keys are listed and dumped
# with to_json (which keeps dict order) so an order change shows. The uri
# results are no_log: their Date header differs on every run.
- hosts: target
  gather_facts: false
  tasks:
    - name: an echo server on the target
      copy:
        dest: /tmp/jko_server.py
        content: |
          import http.server
          DOC = b'{"zeta": 1, "alpha": {"y": 2.0, "b": [{"k2": 1, "k1": null}]}, "mid": "m"}'
          class H(http.server.BaseHTTPRequestHandler):
              def reply(self, body):
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def do_GET(self):
                  self.reply(DOC)
              def do_POST(self):
                  self.reply(self.rfile.read(int(self.headers['Content-Length'])))
              def log_message(self, *args):
                  pass
          http.server.HTTPServer(('127.0.0.1', 18765), H).serve_forever()
    - name: start it
      shell: nohup python3 /tmp/jko_server.py >/dev/null 2>&1 &
      changed_when: false
    - wait_for: {port: 18765, host: 127.0.0.1, timeout: 20}

    - name: the server's order
      uri: {url: "http://127.0.0.1:18765/doc"}
      register: r
      no_log: true
    - debug: {msg: "{{ r.json | to_json }} {{ r.json.keys() | list }} {{ r.json.alpha.b[0].keys() | list }}"}

    - name: a json body's order, echoed
      uri:
        url: "http://127.0.0.1:18765/echo"
        method: POST
        body_format: json
        body: {zz: 1, aa: {y: 1.0, b: [{q: 1, c: 2}]}, mm: [3, 2]}
      register: r
      no_log: true
    - debug: {msg: "{{ r.json | to_json }} {{ r.json.aa.keys() | list }}"}

    - name: stop the server
      shell: pkill -f jko_server.py || true
      changed_when: false
