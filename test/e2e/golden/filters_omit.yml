---
# default(omit), omit propagation, and the select/map/regex filter chains that
# dominate real playbooks. Each assertion encodes the exact result real
# ansible-playbook produces so any divergence is a status mismatch.
- name: filters and omit
  hosts: all
  gather_facts: false
  vars:
    maybe: "set"
    users:
      - {name: alice, shell: /bin/zsh}
      - {name: bob}
      - {name: carol, shell: /bin/fish}
    servers:
      - {name: web1, role: web, port: 80}
      - {name: db1, role: db, port: 5432}
      - {name: web2, role: web, port: 8080}
    mixed:
      - {k: Web}
      - {k: web}
  tasks:
    - name: default 1-arg vs 2-arg boolean semantics
      assert:
        that:
          - "(maybe | default('fallback')) == 'set'"
          - "(missing | default('fallback')) == 'fallback'"
          - "('' | default('x', true)) == 'x'"             # empty string is falsy under 2-arg default
          - "('' | default('x')) == ''"                    # but stays under 1-arg default (defined, just falsy)
          - "(0 | default(5, true)) == 5"                  # 0 is falsy -> 2-arg default applies

    - name: selectattr / rejectattr with defined
      assert:
        that:
          - "(users | selectattr('shell', 'defined') | map(attribute='name') | list) == ['alice', 'carol']"
          - "(users | rejectattr('shell', 'defined') | map(attribute='name') | list) == ['bob']"

    - name: map extract and join chains
      assert:
        that:
          - "(servers | map(attribute='port') | map('string') | join(',')) == '80,5432,8080'"
          - "(servers | selectattr('role', 'eq', 'web') | map(attribute='name') | join('-')) == 'web1-web2'"

    - name: groupby sorts groups and folds case by default
      assert:
        that:
          # groupby sorts groups by the grouping key.
          - "(servers | groupby('role') | map(attribute='0') | list) == ['db', 'web']"
          # Grouped rows keep source order; web has web1 then web2.
          - "(servers | groupby('role') | selectattr('0', 'eq', 'web') | map(attribute='1') | first | map(attribute='name') | list) == ['web1', 'web2']"
          # Case-insensitive by default (Web/web fold, first-seen grouper kept);
          # case_sensitive=true keeps them apart.
          - "(mixed | groupby('k') | map(attribute='0') | list) == ['Web']"
          - "(mixed | groupby('k', case_sensitive=true) | map(attribute='0') | list) == ['Web', 'web']"

    - name: compute regex results via set_fact
      set_fact:
        rx_date: "{{ '2026-07-22' | regex_replace('(\\d+)-(\\d+)-(\\d+)', '\\3/\\2/\\1') }}"
        rx_swap: "{{ 'key=val' | regex_replace('(\\w+)=(\\w+)', '\\2=\\1') }}"
        rx_hit: "{{ 'port 8080 open' | regex_search('\\d+') }}"
        rx_miss: "{{ 'no numbers' | regex_search('\\d+') }}"

    - name: regex filters match ansible
      assert:
        that:
          - "rx_date == '22/07/2026'"
          - "rx_swap == 'val=key'"
          - "rx_hit == '8080'"
          - "rx_miss == none"          # regex_search returns None on no match

    - name: select tests and ternary
      assert:
        that:
          - "([1, 2, 3] | select('odd') | list) == [1, 3]"
          - "(5 | ternary('big', 'small')) == 'big'"
          - "(0 | ternary('big', 'small')) == 'small'"
