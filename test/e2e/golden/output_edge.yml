---
# Output fidelity: debug var/msg in loops, labels, undefined vars, assert
# results, command failures, skipped loops.
- hosts: localhost
  gather_facts: false
  tasks:
    - debug: {var: item}
      loop: [1, "two"]
    - debug: {msg: "{{ item }}"}
      loop: [[1, "a"], null, true, 1.5, "é"]
      loop_control: {label: "L{{ item }}"}
    - debug: {var: undefined_thing}
    - assert: {that: [1 == 2]}
      ignore_errors: true
    - assert: {that: [1 == 1]}
    - shell: "exit 3"
      ignore_errors: true
    - command: /bin/echo x
      when: false
    - debug: {msg: "{{ item }}"}
      loop: [1]
      when: item == 2
    - ping:
      register: r
    - fail: {msg: "stop"}
      loop: [a]
      ignore_errors: true
